name: One-time issue metadata backfill
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  backfill:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'arena/d4cb3324-foundra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply documented labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          apply_labels() {
            local issue="$1"
            shift
            local labels payload
            labels=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            payload=$(jq -n --argjson labels "$labels" '{labels: $labels}')
            printf '%s' "$payload" \
              | gh api "repos/$REPO/issues/$issue" -X PATCH --input - >/dev/null
          }

          apply_labels 19 "status: backlog" "priority: P1" "help wanted"
          apply_labels 20 "status: ready" "priority: P1"
          apply_labels 21 "status: backlog" "priority: P2" "help wanted"
          apply_labels 22 "status: backlog" "priority: P2" "help wanted"
          apply_labels 23 "status: ready" "priority: P3"

      - name: Apply issue type through supported API paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner=${REPO%/*}
          name=${REPO#*/}

          gh --version
          echo "== available issue types =="
          gh api "repos/$REPO/issue-types" --jq '.[] | [.id,.name,.node_id] | @tsv'
          echo "== GraphQL issueTypes =="
          gh api graphql -f query="query { repository(owner:\"$owner\",name:\"$name\") { issueTypes(first:20) { nodes { id name } } } }" --jq '.data.repository.issueTypes' || true

          for issue in 19 20 21 22 23; do
            echo "== issue #$issue =="
            gh issue edit "$issue" --repo "$REPO" --type Task || true
            current=$(gh api "repos/$REPO/issues/$issue" --jq '.type.name // ""')
            if [ "$current" = "Task" ]; then
              echo "type set by gh CLI"
              continue
            fi

            issue_id=$(gh api graphql -f query="query { repository(owner:\"$owner\",name:\"$name\") { issue(number:$issue) { id } } }" --jq '.data.repository.issue.id')
            rest_type_id=$(gh api "repos/$REPO/issue-types" --jq '.[] | select(.name=="Task") | .node_id')
            echo "issue node: $issue_id; REST type node: $rest_type_id"
            gh api graphql -f query="mutation { updateIssueIssueType(input:{issueId:\"$issue_id\", issueTypeId:\"$rest_type_id\"}) { issue { number issueType { name } } } }" || true
            gh api graphql -f query="mutation { updateIssue(input:{id:\"$issue_id\", issueTypeId:\"$rest_type_id\"}) { issue { number issueType { name } } } }" || true
          done

      - name: Verify metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for issue in 19 20 21 22 23; do
            gh api "repos/$REPO/issues/$issue" --jq \
              '"\(.number)\t\(.type.name // "none")\t\([.labels[].name] | sort | join(","))"'
          done
