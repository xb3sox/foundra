name: One-time issue metadata backfill
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  backfill:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'arena/d4cb3324-foundra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply documented issue types and labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          apply() {
            local issue="$1"
            local type="$2"
            shift 2
            local labels payload
            labels=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            payload=$(jq -n \
              --arg type "$type" \
              --argjson labels "$labels" \
              '{type: $type, labels: $labels}')
            printf '%s' "$payload" \
              | gh api "repos/$REPO/issues/$issue" -X PATCH --input - >/dev/null
          }

          apply 19 Task "status: backlog" "priority: P1" "help wanted"
          apply 20 Task "status: ready" "priority: P1"
          apply 21 Task "status: backlog" "priority: P2" "help wanted"
          apply 22 Task "status: backlog" "priority: P2" "help wanted"
          apply 23 Task "status: ready" "priority: P3"

      - name: Verify metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for issue in 19 20 21 22 23; do
            gh api "repos/$REPO/issues/$issue" --jq \
              '"\(.number)\t\(.type.name // "none")\t\([.labels[].name] | sort | join(","))"'
          done
